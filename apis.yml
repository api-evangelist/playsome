name: Playsome
description: >-
  Playsome (Playsome Ltd. / Playsome Oy) is a Helsinki, Finland mobile game studio that
  builds free-to-play games combining deep gameplay with polished visuals under the philosophy
  of making "big games with a small team". Its flagship title is Friends & Dragons, a
  cooperative multiplayer puzzle-RPG for iOS and Android featuring 150+ collectible heroes and
  700+ puzzles and dungeons. The company is backed by gaming-focused venture firms Play Ventures
  and EQT. Playsome does not publish a traditional developer API, but its Wix-hosted website
  exposes a live Wix Site MCP endpoint for agentic AI access, letting agents retrieve business
  details, search the site, and start bookings/purchases without scraping.
